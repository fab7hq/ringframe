name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.32"
      - run: uv sync --python ${{ matrix.python-version }} --locked
      - run: |
          uv lock --check --no-config
          uv run --python ${{ matrix.python-version }} --locked python -m compileall -q core
          git diff --check
      - run: uv run --python ${{ matrix.python-version }} --locked pytest
