[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ringframe"
version = "0.0.3"
description = "Explicit intent, evaluation, and decision layer inside native AI harnesses"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
ringframe = "ringframe.cli:main"

[project.urls]
Repository = "https://github.com/fab7hq/ringframe"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = { "" = "core" }

[tool.setuptools.packages.find]
where = ["core"]
include = ["ringframe*"]

[tool.setuptools.package-data]
ringframe = ["profiles/*.yaml", "deltas/*.yaml", "deltas/practice/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["core"]
testpaths = ["core/tests"]
addopts = "-q"
